<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-labelledby="github-vs-unique-title github-vs-unique-desc" font-family="inherit" font-size="12" viewBox="0 0 640 184"><title>Коммиты: GitHub и уникальные</title><desc>GitHub насчитал 10 542 коммита, без трёх копий платформы 3 609; уникальных коммитов в репозиториях 10 173.</desc><text x="12" y="21" font-size="15">GitHub: коммиты в профиле</text><text x="12" y="37" opacity=".65">каждая из трёх копий платформы считается отдельно</text><path fill-opacity=".35" d="M12 44h543q3 0 3 3v8q0 3-3 3H12Z"/><text x="566" y="56" font-size="15" font-weight="600">10 542</text><text x="12" y="79" font-size="15">GitHub без трёх копий платформы</text><text x="12" y="95" opacity=".65">минус 6 933 коммита (65,8 %)</text><path fill-opacity=".35" d="M12 102h183.9q3 0 3 3v8q0 3-3 3H12Z"/><text x="206.9" y="114" font-size="15" font-weight="600">3 609</text><text x="12" y="137" font-size="15">Уникальные коммиты в репозиториях</text><text x="12" y="153" opacity=".65">без слияний и дублей, из них 76 - переносы и массовые правки</text><path fill="#2a78d6" d="M12 160h523.9q3 0 3 3v8q0 3-3 3H12Z"/><text x="546.9" y="172" font-size="15" font-weight="600">10 173</text></svg>